spring.application.name=cn_assignment

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/assignment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:assignment}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:assignment}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080