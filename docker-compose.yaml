services:
  mysql:
    image: mysql:8.4
    container_name: assignment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assignment_db
      MYSQL_USER: assignment
      MYSQL_PASSWORD: assignment
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: assignment-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/assignment_db
      SPRING_DATASOURCE_USERNAME: assignment
      SPRING_DATASOURCE_PASSWORD: assignment

  frontend:
    build: ./frontend
    container_name: assignment-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data: